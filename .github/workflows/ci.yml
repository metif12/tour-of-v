name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The tour runs code submitted by anyone who visits it, so the container is part
# of the trust boundary. That is why this job exists: `v test .` checks that a
# page has a program and that the example embeds non-empty, but it never compiles
# anything, and eight examples shipped that compiled on the author's machine and
# not in the sandbox. The image build and the self-test are the only checks that
# reflect what a reader actually runs.
#
# There is deliberately no separate job for `v fmt`, `v -check` and `v test`.
# The tour is built with a source build of V at V_COMMIT, which is weeks newer
# than the newest release, so no release binary compiles it: the 0.5.2 release
# fails `v -check` on veb. The image build compiles the tour with the pinned
# compiler and fails if it does not build, which is the same check, and it is the
# one that uses the compiler the tour is actually built with.

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the image compiles the tour with the pinned source compiler,
      # fetches the release compiler for the sandbox, and builds isolate from
      # source. It needs a C compiler, which ubuntu-latest has.
      - name: Build image
        run: docker build -t tour-of-v:ci .

      # The self-test compiles and runs a program inside a real sandbox and then
      # attacks it. It needs `--privileged` for the namespaces and `--tmpfs` so
      # the box has a writable temporary filesystem.
      - name: Self-test
        run: docker run --rm --privileged --tmpfs /tmp tour-of-v:ci /usr/local/bin/tour --self-test-only