<!doctype html>
<html lang="en" data-theme="auto">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>@title</title>
	<!-- CodeMirror's own stylesheet comes first on purpose. app.css recolours
	     the editor from the theme variables, and several of those rules have
	     the same specificity as CodeMirror's defaults (`.CodeMirror`,
	     `.CodeMirror-gutters`), so whichever sheet is linked last wins. With
	     this order the recolouring wins, which is what makes the code panel
	     follow the light and dark themes. -->
	<link rel="stylesheet" href="/codemirror/lib/codemirror.css">
	<link rel="stylesheet" href="/app.css">
	<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
</head>

<body>
	<header class="top-bar">
		<a href="/welcome/1" class="logo-link">
			<img src="/logo.svg" alt="" class="logo" width="26" height="26">
			<span>A Tour of V</span>
		</a>
		<div class="right">
			<button class="bar-button" id="toc-toggle" aria-label="Table of contents"
				aria-expanded="false">
				<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2"
						fill="none" stroke-linecap="round" />
				</svg>
			</button>
			<button class="bar-button" id="help-toggle" aria-label="Keyboard shortcuts"
				aria-expanded="false">
				<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"
						fill="none" />
					<path d="M9.4 9.2a2.7 2.7 0 1 1 3.4 2.9c-.6.2-.8.7-.8 1.3v.6" stroke="currentColor"
						stroke-width="2" fill="none" stroke-linecap="round" />
					<circle cx="12" cy="17.2" r="1.15" fill="currentColor" />
				</svg>
			</button>
			<button class="bar-button" id="theme-toggle" aria-label="Toggle theme">
				<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="12" r="4.5" fill="currentColor" />
					<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
						stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
				</svg>
			</button>
		</div>
	</header>

	<div class="help-overlay" id="help-overlay" hidden></div>
	<div class="help-panel" id="help-panel" hidden role="dialog" aria-label="Keyboard shortcuts"
		aria-modal="false">
		<div class="help-header">
			<h3>Keyboard shortcuts</h3>
			<button class="help-close" id="help-close" aria-label="Close">
				<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
						fill="none" stroke-linecap="round" />
				</svg>
			</button>
		</div>
		<div class="help-shortcut">
			<span class="help-desc">Run the program</span>
			<span class="help-keys"><kbd>Shift</kbd> + <kbd>Enter</kbd></span>
		</div>
		<div class="help-shortcut">
			<span class="help-desc">Next page</span>
			<span class="help-keys"><kbd>PageDown</kbd></span>
		</div>
		<div class="help-shortcut">
			<span class="help-desc">Previous page</span>
			<span class="help-keys"><kbd>PageUp</kbd></span>
		</div>
		<div class="help-shortcut">
			<span class="help-desc">Open or close this help</span>
			<span class="help-keys"><kbd>?</kbd></span>
		</div>
		<div class="help-shortcut">
			<span class="help-desc">Move between panes</span>
			<span class="help-keys"><kbd>Tab</kbd></span>
		</div>
	</div>

	<div class="click-catcher" id="toc-catcher" hidden></div>
	<nav class="toc" id="toc" hidden aria-label="Table of contents">
		@veb.raw(toc)
	</nav>

	<main id="content">
		@veb.raw(veb_content)
	</main>

	<script src="/codemirror/lib/codemirror.js"></script>
	<script src="/codemirror/mode/vlang/vlang.js"></script>
	<script src="/app.js"></script>
</body>

</html>
